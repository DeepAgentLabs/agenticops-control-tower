name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint (ruff check)
        run: uv run ruff check src tests

      # Scoped to src/tests, not ".". The repo docs intentionally contain
      # pseudocode and architecture snippets that are not meant to be treated
      # as executable Python by the formatter.
      - name: Format check (ruff format)
        run: uv run ruff format --check src tests

      - name: Type check (mypy)
        run: uv run mypy

      - name: Test (pytest)
        run: uv run pytest

  ecosystem:
    # Actual-producer reader tests against the published optional sibling extras.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Test with published siblings
        env:
          TOWER_REQUIRE_LENS_EXECUTION: "1"
        run: >-
          uv run --python 3.12 --extra dev --extra agenticlens --extra agentic-evals
          --extra agentic-sidecar --extra agentic-chaos --extra deep-agentic-core-mcp python -m pytest

  package:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --extra dev --python 3.12
      - name: Build distributions
        run: |
          uv run python -m build
          uv run python -m twine check dist/*


      - name: Verify standalone installed-wheel schema resources
        run: |
          for wheel in dist/*.whl; do
            uv run --isolated --no-project --with "$wheel" python -I scripts/smoke_evals_contract.py
          done
