# Include within Nginx's http context. Replace hostname and certificate paths.
# Assumes Control Tower is running on the same VM at 127.0.0.1:8000.
server {
    listen 80;
    server_name tower.example.com;
    return 301 https://tower.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name tower.example.com;
    ssl_certificate /etc/letsencrypt/live/tower.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tower.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }
}
